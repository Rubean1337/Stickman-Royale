<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabard Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6ee;--fg:#1c2a1c;--pn:#fff;--ln:#1c2a1c;--blue:#00a2e8;--red:#ed1c24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--fg:#e8f0e4;--pn:#22332a;--ln:#e8f0e4}}
:root[data-theme="dark"]{--bg:#15201a;--fg:#e8f0e4;--pn:#22332a;--ln:#e8f0e4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:18px}
#app{max-width:1700px;margin:0 auto;padding:8px;position:relative}
canvas{image-rendering:auto;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 235px);min-height:300px;display:block;margin:0 auto;border:3px solid var(--ln);border-radius:6px;touch-action:none;background:#22b14c}
button{font:inherit;color:var(--fg);background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue)}button:disabled{opacity:.45;cursor:default}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:8px}
#bar{flex:1;height:18px;border:2px solid var(--ln);border-radius:9px;overflow:hidden;background:var(--pn)}
#fill{height:100%;width:50%;background:#f5b800;transition:width .1s}
#hand{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.card{flex:1 1 110px;text-align:left;position:relative;padding:6px 8px}
.card.sel{background:var(--blue);color:#fff}.card b{display:block}
.cost{position:absolute;top:-8px;right:-6px;background:#f5b800;color:#000;border:2px solid #000;border-radius:50%;width:26px;height:26px;text-align:center;line-height:22px}
#menu{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);padding:14px;overflow:auto;z-index:5}
#menu h1{margin:0 0 4px;font-size:40px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row button.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.box{background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:8px}
.lock{background:#b4b4b4!important;color:#666;border-color:#8a8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lock{background:#444!important;color:#9a9a9a;border-color:#666}}
:root[data-theme="dark"] .lock{background:#444!important;color:#9a9a9a;border-color:#666}
#go{font-size:26px;padding:8px 26px;background:var(--red);color:#fff}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.slider>section{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 4px}
.dcard{text-align:left;min-height:62px}
#emrow[hidden]{display:none}
.deckgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile .row{margin:6px 0 0}.tile button{padding:4px 8px;font-size:15px}
@media (max-width:640px){.deckgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chest{font-size:110px;background:none;border:none;cursor:pointer;padding:6px 20px;line-height:1.1}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg) scale(1.1)}60%{transform:rotate(-9deg)}80%{transform:rotate(9deg)}}
.chest.shake{animation:shk .35s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.stars{font-size:56px;color:#f5b800;animation:pop .5s;letter-spacing:4px}
.chimg{width:130px;height:auto;image-rendering:pixelated;display:block}
.chmini{width:38px;height:auto;image-rendering:pixelated;vertical-align:middle;margin-right:4px}
#tut,#praise{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;background:var(--pn);border:3px solid var(--ln);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#tut{top:64px;left:50%;transform:translateX(-50%);max-width:min(92%,620px)}
#praise{bottom:150px;left:14px;font-size:26px;font-weight:bold}
#tut[hidden],#praise[hidden],#tobj[hidden]{display:none}
#tobj{position:absolute;z-index:3;top:64px;left:50%;transform:translateX(-50%);background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:4px 12px;font-size:17px;max-width:min(92%,620px);text-align:center}
#tut img,#praise img{height:84px;width:auto;image-rendering:pixelated}
#tkt{font-size:19px;line-height:1.25;margin-bottom:6px}
.bt{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.btl{flex:1 1 360px;min-width:0}.btr{flex:0 1 340px;min-width:260px}
.crl{max-height:440px;overflow-y:auto;margin-top:6px}
.crw{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--ln);border-radius:6px;margin-bottom:3px;font-size:16px;background:var(--pn)}
.crw.done{opacity:.55}.crw.ready{border-color:#f5b800;border-width:2px}
.crw button{padding:2px 8px;font-size:15px}
.rar{font-size:13px;padding:1px 7px;border-radius:9px;color:#fff;vertical-align:middle}
.rar.common{background:#7a7a7a}.rar.rare{background:#e07a1f}
.rar-common{border-left:6px solid #7a7a7a!important}.rar-rare{border-left:6px solid #e07a1f!important}
input#pname{font:inherit;padding:4px 8px;border:2px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--fg);width:170px;margin-left:6px}
.crn{height:1.1em;width:auto;image-rendering:pixelated;vertical-align:-.2em}
.gem{height:1.15em;width:auto;image-rendering:pixelated;vertical-align:-.25em}
.gem.pocket{height:32px;vertical-align:middle}

function onPlace(m){const d=m.data;if(m.isMe||!MP||MP.role!='host'||m.peer!=MP.opp||!G||!G.pvp||G.done||G.mode==2||!d)return;
 const k=d.k,i=G.bh.indexOf(k);if(i<0||!(+d.x>=0)||!(+d.y>=0))return;const c=CARDS[k],s=canPlace(1,k,+d.x,+d.y);if(!s||G.el[1]<c.c)return;
 G.el[1]-=c.c;spawn(1,k,s.x,s.y,G.glv[k]||1);cyc(G.bh,G.bq,i)}
function hostTick(dt){if(!MP||!MP.room)return;MP.acc+=dt;if(MP.acc>=.1){MP.acc=0;sendSnap()}}
function sendSnap(){const g=G,M=MP;if(!M||!M.room||!g)return;const L=[];
 for(const e of g.E){if(!e.id)e.id=++M.uid;L.push([e.id,e.k||0,e.kind||0,e.team,e.lv||0,e.x|0,e.y|0,Math.ceil(e.hp),Math.round(e.mhp),(e.act?1:0)|(e.mv>0?2:0)|((e.fx<0?2:e.fx>0?1:0)<<2)|(e.life?16:0),e.pt>0&&e.pd?+(e.pt/e.pd).toFixed(2):0,e.ttl?e.ttl|0:0,e.kind=='f'?+(e.cd/3).toFixed(2):0])}
 const s=++M.seq,n=Math.max(1,Math.ceil(L.length/36));
 for(let i=0;i<n;i++){const m={s,i,n,E:L.slice(i*36,i*36+36)};
  if(!i){m.t=+g.t.toFixed(1);m.m=g.mode;m.b=+Math.max(0,g.ban).toFixed(1);m.e=+g.el[1].toFixed(2);m.h=g.bh;m.q=g.bq[0]||g.bh[0];
   m.p=g.pr.slice(0,20).map(p=>[p.x|0,p.y|0,+p.a.toFixed(2),p.team,p.ball?1:0]);m.z=g.sp.map(p=>[p.team,p.x|0,p.y|0,p.k,p.rad,+p.t.toFixed(2)]);
   m.r=g.ruins.slice(0,10).map(r=>[r.x|0,r.y|0,r.team,r.k?1:0,r.d?1:0,+Math.min(r.t,9999).toFixed(1),r.v])}
  emit('snap',m)}}
function endPvp(w){G.done=1;sendSnap();emit('over',{w});showResult(pvpMsg(w))}
function pvpMsg(w){return '<div style="text-align:center;font-size:32px"><b>'+(w==1?'Victory!':w==-1?'Defeat.':'Draw.')+'</b></div>'+scoreBox(0).replace(/<div style="text-align:center;margin-top:10px">[\s\S]*$/,'')+'<p>Friendly battle: no trophies or rewards.</p>'}
function oppLeft(){if(!G||!G.pvp||G.done)return;G.done=1;showResult('<b>Your friend left the match.</b> No result.')}
/* guest side: sees the host sim mirrored so they always play the blue left side */
function onGo(m){if(m.isMe||!MP||MP.role!='guest'||MP.started)return;const d=m.data||{},nm=String(d.n||'Friend').slice(0,14);
 MP.started=1;MP.opp=m.peer;clearInterval(MP.iv);MP.ents={};MP.buf=null;MP.last=0;
 $('emrow').hidden=true;$('menu').style.display='none';$('tut').hidden=true;$('tobj').hidden=true;$('hand').innerHTML='';
 G={guest:1,pvp:1,E:[],hand:[],q:[],el:[5,0],t:MAXT,arena:Math.max(0,Math.min(ARENAS.length-1,d.a|0)),mode:0,ban:0,em:[],ecd:0,fx:[],sp:[],pr:[],ruins:[],done:0,opp:badName(nm)?'Friend':nm};
 sel=null;last=performance.now()}
function onSnap(m){const d=m.data;if(m.isMe||!MP||m.peer!=MP.opp||!G||!G.guest||!d||typeof d.s!='number'||d.s<=MP.last)return;
 if(!MP.buf||MP.buf.s!=d.s){if(MP.buf&&d.s<MP.buf.s)return;MP.buf={s:d.s,n:d.n,c:{}}}
 MP.buf.c[d.i]=d;if(Object.keys(MP.buf.c).length==MP.buf.n){const B=MP.buf;MP.buf=null;try{applySnap(B)}catch(e){}}}
function applySnap(B){const g=G,h=B.c[0],old=MP.ents;if(!h)return;MP.last=B.s;g.t=h.t;g.mode=h.m;g.ban=h.b;g.el[0]=h.e;
 if(h.h&&(h.h.join()!=g.hand.join()||h.q!=g.q[0])){g.hand=h.h.slice();g.q=[h.q];hand()}
 const seen={};
 for(let i=0;i<B.n;i++)for(const a of B.c[i].E){const id=a[0];seen[id]=1;let e=old[id];
  if(!e){const c=CARDS[a[1]]||{},kd=a[2]||undefined,sc=kd=='king'?2.2:kd=='p'?1.9:c.sc||1;
   e=old[id]={id,k:a[1]||undefined,kind:kd,team:1-a[3],sc,r:kd=='king'?55:kd=='p'?37:8*sc,rg:kd=='king'?320:kd=='p'?420:c.rg||0,bld:(kd||c.bld)?1:0,x:W-a[5],y:a[6],ph:0,mv:0,cd:0,dep:0};g.E.push(e)}
  e.tx=W-a[5];e.ty=a[6];e.hp=a[7];e.mhp=a[8];e.lv=a[4];const f=a[9];e.act=f&1;if(f&2)e.mv=.15;const fc=(f>>2)&3;e.fx=fc?(fc==1?-1:1):undefined;e.life=f&16;e.pt=a[10];e.pd=1;e.ttl=a[11];if(e.kind=='f')e.cd=a[12]*3}
 for(const id in old)if(!seen[id])delete old[id];g.E=Object.values(old);
 g.pr=(h.p||[]).map(p=>({x:W-p[0],y:p[1],a:Math.PI-p[2],team:1-p[3],ball:p[4],sp:p[4]?300:430}));
 g.sp=(h.z||[]).map(s=>({team:1-s[0],x:W-s[1],y:s[2],k:s[3],rad:s[4],t:s[5]}));
 g.ruins=(h.r||[]).map(r=>({x:W-r[0],y:r[1],team:1-r[2],k:!!r[3],d:!!r[4],t:r[5],v:r[6]}))}
function gtick(dt){const g=G,k=Math.min(1,dt*14);g.ban-=dt;g.ecd-=dt;
 for(const e of g.E){if(e.tx!=null){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}e.mv-=dt;if(e.mv>0)e.ph=(e.ph||0)+dt*9}
 for(const s of g.sp)s.t+=dt;for(const p of g.pr){p.x+=Math.cos(p.a)*p.sp*dt;p.y+=Math.sin(p.a)*p.sp*dt}
 for(const r of g.ruins)r.t-=dt;for(const m of g.em)m.t+=dt;g.em=g.em.filter(m=>m.t<2.6)}
function guestPlace(e){if(!G||!G.guest||G.done||G.mode==2||!sel)return;const p=pos(e),c=CARDS[sel],s=canPlace(0,sel,p.x,p.y);if(!s||G.el[0]<c.c)return;
 emit('place',{k:sel,x:W-s.x,y:s.y});G.el[0]-=c.c;sel=null;paint()}
function onOver(m){if(m.isMe||!MP||MP.role!='guest'||m.peer!=MP.opp||!G||!G.guest||G.done)return;G.done=1;showResult(pvpMsg(-Math.sign(+(m.data&&m.data.w)||0)))}
