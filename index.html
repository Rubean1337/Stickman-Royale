<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabard Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6ee;--fg:#1c2a1c;--pn:#fff;--ln:#1c2a1c;--blue:#00a2e8;--red:#ed1c24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--fg:#e8f0e4;--pn:#22332a;--ln:#e8f0e4}}
:root[data-theme="dark"]{--bg:#15201a;--fg:#e8f0e4;--pn:#22332a;--ln:#e8f0e4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:18px}
#app{max-width:1700px;margin:0 auto;padding:8px;position:relative}
canvas{image-rendering:auto;--ui:235px;width:min(100%,calc((100vh - var(--ui) - 6px)*2.7143 + 6px));width:min(100%,calc((100dvh - var(--ui) - 6px)*2.7143 + 6px));max-width:1520px;height:auto;display:block;margin:0 auto;border:3px solid var(--ln);border-radius:6px;touch-action:none;background:#22b14c}
button{font:inherit;color:var(--fg);background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue)}button:disabled{opacity:.45;cursor:default}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:8px}
#bar{flex:1;height:18px;border:2px solid var(--ln);border-radius:9px;overflow:hidden;background:var(--pn)}
#fill{height:100%;width:50%;background:#f5b800;transition:width .1s}
#hand{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.card{flex:1 1 110px;text-align:left;position:relative;padding:6px 8px}
.card.sel{background:var(--blue);color:#fff}.card b{display:block}.card{display:flex;align-items:center;gap:6px}.ci{height:40px;width:auto;image-rendering:pixelated;flex:none}.tile .ci{height:38px;vertical-align:middle;margin-right:6px}
.cost{position:absolute;top:-8px;right:-6px;background:#f5b800;color:#000;border:2px solid #000;border-radius:50%;width:26px;height:26px;text-align:center;line-height:22px}
#menu{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);padding:14px;overflow:auto;z-index:5}
#menu h1{margin:0 0 4px;font-size:40px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row button.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.box{background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:8px}
.lock{background:#b4b4b4!important;color:#666;border-color:#8a8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lock{background:#444!important;color:#9a9a9a;border-color:#666}}
:root[data-theme="dark"] .lock{background:#444!important;color:#9a9a9a;border-color:#666}
#go{font-size:26px;padding:8px 26px;background:var(--red);color:#fff}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.slider>section{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 4px}
.dcard{text-align:left;min-height:62px}
#emrow[hidden]{display:none}
.deckgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile .row{margin:6px 0 0}.tile button{padding:4px 8px;font-size:15px}
@media (max-width:640px){.deckgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chest{font-size:110px;background:none;border:none;cursor:pointer;padding:6px 20px;line-height:1.1}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg) scale(1.1)}60%{transform:rotate(-9deg)}80%{transform:rotate(9deg)}}
.chest.shake{animation:shk .35s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.stars{font-size:56px;color:#f5b800;animation:pop .5s;letter-spacing:4px}
.chimg{width:130px;height:auto;image-rendering:pixelated;display:block}
.chmini{width:38px;height:auto;image-rendering:pixelated;vertical-align:middle;margin-right:4px}
#tut,#praise{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;background:var(--pn);border:3px solid var(--ln);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#tut{top:64px;left:50%;transform:translateX(-50%);max-width:min(92%,620px)}
#praise{bottom:150px;left:14px;font-size:26px;font-weight:bold}
#tut[hidden],#praise[hidden],#tobj[hidden]{display:none}
#tobj{position:absolute;z-index:3;top:64px;left:50%;transform:translateX(-50%);background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:4px 12px;font-size:17px;max-width:min(92%,620px);text-align:center}
#tut img,#praise img{height:84px;width:auto;image-rendering:pixelated}
#tkt{font-size:19px;line-height:1.25;margin-bottom:6px}
.bt{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.btl{flex:1 1 360px;min-width:0}.btr{flex:0 1 340px;min-width:260px}
.crl{max-height:440px;overflow-y:auto;margin-top:6px}
.crw{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--ln);border-radius:6px;margin-bottom:3px;font-size:16px;background:var(--pn)}
.crw.done{opacity:.55}.crw.ready{border-color:#f5b800;border-width:2px}
.crw button{padding:2px 8px;font-size:15px}
.rar{font-size:13px;padding:1px 7px;border-radius:9px;color:#fff;vertical-align:middle}
.rar.common{background:#7a7a7a}.rar.rare{background:#e07a1f}
.rar-common{border-left:6px solid #7a7a7a!important}.rar-rare{border-left:6px solid #e07a1f!important}
input#pname{font:inherit;padding:4px 8px;border:2px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--fg);width:170px;margin-left:6px}
.crn{height:1.1em;width:auto;image-rendering:pixelated;vertical-align:-.2em}
.gem{height:1.15em;width:auto;image-rendering:pixelated;vertical-align:-.25em}
.gem.pocket{height:32px;vertical-align:middle}
@media (orientation:portrait) and (max-width:700px){#app::before{content:'Tip: turn your phone sideways for a bigger battlefield';display:block;text-align:center;font-size:14px;opacity:.7}}
@media (orientation:landscape) and (max-height:560px){
body{font-size:15px}
#app{padding:4px max(6px,env(safe-area-inset-right)) 4px max(6px,env(safe-area-inset-left))}
canvas{--ui:110px;border-width:2px}
#hud{padding:2px;gap:6px}#hud button{padding:2px 8px;font-size:14px}#bar{height:14px}
#hand{flex-wrap:nowrap;gap:4px;margin-top:4px}
.card{flex:1 1 0;min-width:0;padding:3px 6px;font-size:13px;line-height:1.15}
.card .ci{height:28px}.cost{width:22px;height:22px;line-height:18px;font-size:13px;top:-6px;right:-4px}
#emrow:not([hidden]){position:absolute;top:36px;right:8px;z-index:6;margin:0;flex-direction:column;background:var(--bg);padding:6px;border:2px solid var(--ln);border-radius:8px}
#menu{padding:8px}#menu h1{font-size:28px}
.chest{font-size:70px}#go{font-size:20px;padding:6px 18px}
.btr{flex-basis:240px;min-width:200px}.crl{max-height:calc(100dvh - 150px)}
#tut{top:40px;padding:4px 8px}#tut img,#praise img{height:48px}#tkt{font-size:15px}
#tobj{top:40px;font-size:14px}#praise{bottom:64px;font-size:20px}
}
</style></head><body><div id="app">
<div id="hud"><span id="tm">2:30</span><div id="bar"><div id="fill"></div></div><b id="el">5 / 10 coins</b><button id="emb" onclick="toggleEm()">Emote</button></div>
<div id="emrow" class="row" hidden><button onclick="pe('mad')">😠 Mad</button><button onclick="pe('sad')">😢 Sad</button><button onclick="pe('support')">👍 Supportive</button><button onclick="pe('laugh')">😂 Laughing</button></div>
<canvas id="cv" width="1520" height="560"></canvas>
<div id="hand"></div>
<div id="tut" hidden><img id="tki" alt="King"><div><div id="tkt"></div><button id="tkn" onclick="tutNext()">Next</button></div></div><div id="tobj" hidden></div><div id="praise" hidden><img id="pki" alt="King"><span id="pkt"></span></div>
<div id="menu"></div>
</div>

function trTxt(r){return r.t=='card'?'New card':r.t=='gem'?r.n+' gems':r.t=='exp'?r.n+' Common EXP':r.n+' Rare EXP'}
function trCheck(){S.rcl=S.rcl||0;const out=[];while(S.rcl<TRW.length&&(S.tr||0)>=TRW[S.rcl].th){const r=TRW[S.rcl++];let t=r.t,n=r.n;

 if(t=='gem'){S.gems+=n;out.push('+'+n+' gems')}else if(t=='exp'){S.exp+=n;out.push('+'+n+' Common EXP')}else if(t=='rexp'){S.expR=(S.expR||0)+n;out.push('+'+n+' Rare EXP')}}

function trRoad(){let o=$('pm');if(!o){o=document.createElement('div');o.id='pm';o.style.cssText='position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o)}
 const n=S.rcl||0,cur=arenaOf(S.tr||0);let h='';for(let a=0;a<ARENAS.length;a++){h+=`<div id='ar${a}' style='margin:10px 0 2px;padding:6px;border-radius:8px;border:2px solid ${a==cur?"var(--blue)":"transparent"};background:linear-gradient(90deg,${ARENAS[a].g1},${ARENAS[a].g2});color:#fff;text-shadow:0 1px 2px #000'><b>Arena ${a+1}: ${ARENAS[a].n}</b>${a==cur?' (you are here)':''}<br><small>${a*360}${a<ARENAS.length-1?' - '+(a*360+359):'+'} trophies</small></div>`;TRW.forEach((r,i)=>{if(r.a==a)h+=`<div style='opacity:${i<n?.5:1}'>${i<n?'✔':'🏆'} ${r.th} &middot; ${trTxt(r)}</div>`})}

function mpSt(t){if(MP)MP.st=t;mpRender()}
function mpEnd(){if(MP){clearInterval(MP.iv);try{MP.room&&MP.room.leave()}catch(e){}MP=null}}
function mpHost(c){if(MP||!RM)return;const A='abcdefghjkmnpqrstuvwxyz23456789';MP={role:'host',code:c||Array.from({length:4},()=>A[Math.random()*A.length|0]).join(''),st:'Opening room...',uid:0,seq:0,acc:0,qm:!!c};mpRender();mpOpen()}
function mpJoin(c,qm){c=String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);if(MP||!RM)return;if(!c){const b=$('mpb');if(b)b.insertAdjacentHTML('beforeend','<small style="color:#c0392b">Type the room code first.</small>');return}MP={role:'guest',code:c,qm:qm,st:'Connecting...',uid:0};mpRender();mpOpen()}
function mpWire(M,r){r.on('hello',onHello);r.on('go',onGo);r.on('snap',onSnap);r.on('place',onPlace);r.on('emo',onEmo);r.on('over',onOver);
 r.onPeers(ch=>{if(MP!==M||!M.started||!M.opp||!G||G.done)return;if(ch.joined&&ch.joined.some(p=>p.peer==M.opp)){if(G.away&&M.role=='host')G.away=0;return}if(ch.left.some(p=>p.peer==M.opp))oppGone()})}
async function mpReopen(M){if(M.reo)return;M.reo=1;try{try{M.room&&M.room.leave()}catch(e){}const r=await RM.join('tc-'+M.code);if(MP===M){M.room=r;mpWire(M,r)}else r.leave()}catch(e){}M.reo=0}
async function mpOpen(){const M=MP;let r,tries=0;
 for(;;){try{r=await RM.join('tc-'+M.code);break}catch(e){
  if(MP!==M)return;
  if(M.resume&&e&&e.code!='not_permitted'&&++tries<=Math.ceil(RJ/3)){await new Promise(ok=>setTimeout(ok,3000));if(MP!==M)return;continue}
  if(M.resume){if(M.role=='guest')rcLeave('Could not reconnect to your match.');return}
  MP=null;mpRender();const b=$('mpb');if(b)b.insertAdjacentHTML('beforeend','<small style="color:#c0392b">Could not open a room ('+((e&&e.code)||'error')+'). Check the code and make sure the host created the room first.</small>');return}}
 if(MP!==M){r.leave();return}M.room=r;mpWire(M,r);
 if(M.qm&&!M.resume)setTimeout(()=>{if(MP===M&&!M.started){mpEnd();mpRender()}},25000);
 if(M.role=='host'){if(!M.resume)mpSt(M.qm?'Match found! Connecting...':'Waiting for your friend...')}
 else{if(!M.resume)mpSt(M.qm?'Match found! Connecting...':'Waiting for the host...');const hi=()=>{emit('hello',helloD())};hi();let n=0;
  M.iv=setInterval(()=>{if(M.started)return clearInterval(M.iv);if(++n>(M.resume?Math.ceil(RJ/1.5):30)){clearInterval(M.iv);if(M.resume)rcLeave('Could not reconnect: your match is no longer available.');else mpSt('No answer. Check the code and ask the host to create a room.')}else hi()},1500)}
}
const emit=(t,d)=>{try{const M=MP;M&&M.room&&M.room.emit(t,d).catch(e=>{if(MP===M&&e&&e.code=='not_permitted'){M.err='not_permitted';mpRender()}})}catch(e){}};
/* host side */
function onHello(m){const d=m.data;if(m.sameTab||!MP||MP.role!='host'||!d)return;const pid=String(d.pid||'').slice(0,24);
 if(MP.started){if((pid&&pid===MP.oppPid)||m.peer==MP.opp){MP.opp=m.peer;if(G&&!G.done)G.away=0;sendGo();if(G&&G.done&&G.w!=null)emit('over',{w:G.w})}return}
 const dk=Array.isArray(d.d)?[...new Set(d.d)].filter(k=>typeof k=='string'&&Object.hasOwn(CARDS,k)).slice(0,8):[];if(dk.length<4)return;
 const lv={};for(const k of dk)lv[k]=Math.max(1,Math.min(MAXL,Math.round(+(d.l&&d.l[k])||1)));
 MP.opp=m.peer;MP.oppPid=pid||m.peer;MP.started=1;const nm=String(d.n||'Friend').slice(0,14);
 startPvp({deck:dk,lv,pt:Math.max(1,Math.min(MAXL,Math.round(+d.p||1))),avg:Math.max(1,Math.min(MAXL,Math.round(+d.a||1))),name:badName(nm)?'Friend':nm});sendGo()}
function sendGo(){emit('go',{n:S.name,a:G?G.arena:0,hp:S.pid})}
function startPvp(g){$('emrow').hidden=true;$('menu').style.display='none';$('tut').hidden=true;$('tobj').hidden=true;
 const pt=S.pt||1,pl=avgL(),E=[tower(0,'p',240,BR[0],pt),tower(0,'p',240,BR[1],pt),tower(0,'king',140,260,pl),tower(1,'p',1280,BR[0],g.pt),tower(1,'p',1280,BR[1],g.pt),tower(1,'king',1380,260,g.avg)];
 const P=deal(S.deck),B=deal(g.deck);
 G={E,hand:P.h,q:P.q,bh:B.h,bq:B.q,el:[5,5],t:MAXT,arena:arenaOf(S.tr||0),mode:0,ban:0,em:[],ecd:0,pl,bl:g.avg,fx:[],sp:[],pr:[],ruins:[],bot:1e9,done:0,pvp:1,qm:MP.qm,opp:g.name,glv:g.lv};
 sel=null;hand();last=performance.now()}
function onPlace(m){const d=m.data;if(m.sameTab||!MP||MP.role!='host'||m.peer!=MP.opp||!G||!G.pvp||G.done||G.mode==2||!d)return;
 G.away=0;const k=d.k,i=G.bh.indexOf(k);if(i<0||!(+d.x>=0)||!(+d.y>=0))return;const c=CARDS[k],s=canPlace(1,k,+d.x,+d.y);if(!s||G.el[1]<c.c)return;
 G.el[1]-=c.c;spawn(1,k,s.x,s.y,G.glv[k]||1);cyc(G.bh,G.bq,i)}
function hostTick(dt){if(!MP||!MP.room)return;MP.acc+=dt;if(MP.acc>=.1){MP.acc=0;sendSnap()}}
function sendSnap(){const g=G,M=MP;if(!M||!M.room||!g)return;const L=[];
 for(const e of g.E){if(!e.id)e.id=++M.uid;L.push([e.id,e.k||0,e.kind||0,e.team,e.lv||0,e.x|0,e.y|0,Math.ceil(e.hp),Math.round(e.mhp),(e.act?1:0)|(e.mv>0?2:0)|((e.fx<0?2:e.fx>0?1:0)<<2)|(e.life?16:0),e.pt>0&&e.pd?+(e.pt/e.pd).toFixed(2):0,e.ttl?e.ttl|0:0,e.kind=='f'?+(e.cd/3).toFixed(2):0])}
 const s=++M.seq,n=Math.max(1,Math.ceil(L.length/36));
 for(let i=0;i<n;i++){const m={s,i,n,E:L.slice(i*36,i*36+36)};
  if(!i){m.t=+g.t.toFixed(1);m.m=g.mode;m.b=+Math.max(0,g.ban).toFixed(1);m.e=+g.el[1].toFixed(2);m.h=g.bh;m.q=g.bq[0]||g.bh[0];
   m.p=g.pr.slice(0,20).map(p=>[p.x|0,p.y|0,+p.a.toFixed(2),p.team,p.ball?1:0,p.dart?1:0]);m.z=g.sp.map(p=>[p.team,p.x|0,p.y|0,p.k,p.rad,+p.t.toFixed(2)]);
   m.r=g.ruins.slice(0,10).map(r=>[r.x|0,r.y|0,r.team,r.k?1:0,r.d?1:0,+Math.min(r.t,9999).toFixed(1),r.v])}
  emit('snap',m)}}
function endPvp(w){G.done=1;G.w=w;sendSnap();emit('over',{w});if(G.qm)qmReward(w);else showResult(pvpMsg(w))}
function pvpMsg(w){return '<div style="text-align:center;font-size:32px"><b>'+(w==1?'Victory!':w==-1?'Defeat.':'Draw.')+'</b></div>'+scoreBox(0).replace(/<div style="text-align:center;margin-top:10px">[\s\S]*$/,'')+'<p>Friendly battle: no trophies or rewards.</p>'}
function oppLeft(){if(!G||!G.pvp||G.done)return;G.done=1;if(G.qm){qmReward(1);return}showResult('<b>Your friend left the match.</b> No result.')}

function onGo(m){if(m.sameTab||!MP||MP.role!='guest')return;const d=m.data||{},hp=String(d.hp||'').slice(0,24);
 if(MP.started){if(hp&&hp===MP.oppPid&&G&&!G.done){MP.opp=m.peer;MP.last=0;MP.buf=null;MP.ents={};G.E=[];G.away=0;MP.lastSnap=performance.now();clearInterval(MP.rv);MP.rv=0}return}
 if(MP.oppPid&&hp&&hp!==MP.oppPid)return;
 const nm=String(d.n||'Friend').slice(0,14);
 MP.started=1;MP.opp=m.peer;MP.oppPid=hp||m.peer;MP.lastSnap=performance.now();clearInterval(MP.iv);MP.ents={};MP.buf=null;MP.last=0;
 $('emrow').hidden=true;$('menu').style.display='none';$('menu').style.background='';$('tut').hidden=true;$('tobj').hidden=true;$('hand').innerHTML='';
 G={guest:1,pvp:1,qm:MP.qm,E:[],hand:[],q:[],el:[5,0],t:MAXT,arena:Math.max(0,Math.min(ARENAS.length-1,d.a|0)),mode:0,ban:0,em:[],ecd:0,fx:[],sp:[],pr:[],ruins:[],done:0,opp:badName(nm)?'Friend':nm};
 sel=null;last=performance.now()}
function onSnap(m){const d=m.data;if(m.sameTab||!MP||m.peer!=MP.opp||!G||!G.guest||!d||typeof d.s!='number'||d.s<=MP.last)return;
 if(!MP.buf||MP.buf.s!=d.s){if(MP.buf&&d.s<MP.buf.s)return;MP.buf={s:d.s,n:d.n,c:{}}}
 MP.buf.c[d.i]=d;if(Object.keys(MP.buf.c).length==MP.buf.n){const B=MP.buf;MP.buf=null;try{applySnap(B)}catch(e){}}}
function applySnap(B){const g=G,h=B.c[0],old=MP.ents;if(!h)return;MP.last=B.s;MP.lastSnap=performance.now();g.away=0;g.t=h.t;g.mode=h.m;g.ban=h.b;g.el[0]=h.e;
 if(h.h&&(h.h.join()!=g.hand.join()||h.q!=g.q[0])){g.hand=h.h.slice();g.q=[h.q];hand()}
 const seen={};
 for(let i=0;i<B.n;i++)for(const a of B.c[i].E){const id=a[0];seen[id]=1;let e=old[id];
  if(!e){const c=CARDS[a[1]]||{},kd=a[2]||undefined,sc=kd=='king'?2.2:kd=='p'?1.9:c.sc||1;
   e=old[id]={id,k:a[1]||undefined,kind:kd,team:1-a[3],sc,r:kd=='king'?55:kd=='p'?37:8*sc,rg:kd=='king'?320:kd=='p'?420:c.rg||0,bld:(kd||c.bld)?1:0,x:W-a[5],y:a[6],ph:0,mv:0,cd:0,dep:0,air:c.air,ha:c.ha};g.E.push(e)}
  e.tx=W-a[5];e.ty=a[6];e.hp=a[7];e.mhp=a[8];e.lv=a[4];const f=a[9];e.act=f&1;if(f&2)e.mv=.15;const fc=(f>>2)&3;e.fx=fc?(fc==1?-1:1):undefined;e.life=f&16;e.pt=a[10];e.pd=1;e.ttl=a[11];if(e.kind=='f')e.cd=a[12]*3}
 for(const id in old)if(!seen[id])delete old[id];g.E=Object.values(old);
 g.pr=(h.p||[]).map(p=>({x:W-p[0],y:p[1],a:Math.PI-p[2],team:1-p[3],ball:p[4],dart:p[5],sp:p[4]?300:p[5]?520:430}));
 g.sp=(h.z||[]).map(s=>({team:1-s[0],x:W-s[1],y:s[2],k:s[3],rad:s[4],t:s[5]}));
 g.ruins=(h.r||[]).map(r=>({x:W-r[0],y:r[1],team:1-r[2],k:!!r[3],d:!!r[4],t:r[5],v:r[6]}))}
function gtick(dt){const g=G,k=Math.min(1,dt*14);g.ban-=dt;g.ecd-=dt;
 for(const e of g.E){if(e.tx!=null){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}e.mv-=dt;if(e.mv>0)e.ph=(e.ph||0)+dt*9;
  if(e.k=='macero'){if(e.pt>0&&e.pt<=.5&&!e.rp){e.rp=1;g.fx.push({ring:1,x:e.x,y:e.y,rr:MRING,l:.3,l0:.3,c:e.team?'237,28,36':'0,162,232',w:4})}else if(!(e.pt>0))e.rp=0}}
 for(const f of g.fx)f.l-=dt;g.fx=g.fx.filter(f=>f.l>0);

 for(const r of g.ruins)r.t-=dt;for(const m of g.em)m.t+=dt;g.em=g.em.filter(m=>m.t<2.6)}
function guestPlace(e){if(!G||!G.guest||G.done||G.mode==2||!sel)return;const p=pos(e),c=CARDS[sel],s=canPlace(0,sel,p.x,p.y);if(!s||G.el[0]<c.c)return;
